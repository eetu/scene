name: Create and publish Docker images

# One image per service, built from the monorepo root Dockerfile via --target.
# Each matrix leg gates on its own paths so an unrelated change doesn't rebuild
# everything. Images: ghcr.io/<owner>/scene-{tracker,party,transcoder}.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [tracker, party, transcoder]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect build-relevant changes
        id: changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            tracker:
              - 'apps/tracker/**'
              - 'packages/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'package.json'
              - 'yarn.lock'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/dockerimage.yaml'
            party:
              - 'apps/party/**'
              - 'packages/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'package.json'
              - 'yarn.lock'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/dockerimage.yaml'
            transcoder:
              - 'services/transcoder/**'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/dockerimage.yaml'

      - name: Decide whether to build this service
        id: gate
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] \
             || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=${{ steps.changes.outputs[matrix.service] }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.gate.outputs.build == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: "arm64"

      - name: Set up Docker Buildx
        if: steps.gate.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to the Container registry
        if: steps.gate.outputs.build == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        if: steps.gate.outputs.build == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push ${{ matrix.service }} image
        if: steps.gate.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # Skip provenance + SBOM: each becomes its own GHCR "version", inflating
          # the package version count for no benefit. (invinite pulls the amd64
          # leg via the normal CI tags; the Pi deploy pulls arm64 — one multi-arch
          # tag serves both.)
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Prune untagged image versions
        if: steps.gate.outputs.build == 'true'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: scene-${{ matrix.service }}
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 5
